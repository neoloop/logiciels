name: BudgetExcelAnalyzer
options:
  bundleIdPrefix: com.mboulenger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX
    from: 0.14.1
targets:
  BudgetExcelAnalyzer:
    type: application
    platform: iOS
    sources:
      - path: BudgetExcelAnalyzer
    dependencies:
      - package: CoreXLSX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A34VXK53RJ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Budget Excel"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mboulenger.BudgetExcelAnalyzer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
