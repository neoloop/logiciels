name: EquipmentRequestApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 1.4.0

targets:
  EquipmentRequestApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/EquipmentRequestApp
        excludes:
          - "Resources/Info.plist"
          - "Resources/EquipmentRequestApp.entitlements"
    resources:
      - path: Sources/EquipmentRequestApp/Resources/Assets.xcassets
    info:
      path: Sources/EquipmentRequestApp/Resources/Info.plist
    entitlements:
      path: Sources/EquipmentRequestApp/Resources/EquipmentRequestApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EquipmentRequestApp
        PRODUCT_NAME: EquipmentRequestApp
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MSAL
